<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter Rewards</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f9fafb;
      --border: #d8dee7;
      --border-strong: #b8c2d0;
      --text: #18202b;
      --muted: #5f6d7d;
      --blue: #2458a6;
      --green: #1f7a4d;
      --amber: #a86700;
      --red: #b3261e;
      --focus: #2f6fed;
      --shadow: 0 8px 24px rgba(22, 34, 51, 0.08);
      --balance-header-height: 34px;
      --balance-row-height: 38px;
      --balance-list-height: 338px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      padding: 7px 11px;
      white-space: nowrap;
    }

    .button-link {
      min-height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 11px;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    button:hover,
    .button-link:hover {
      border-color: var(--focus);
      color: var(--blue);
    }

    button.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      font-weight: 720;
    }

    button.primary:hover {
      color: #fff;
      filter: brightness(.96);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    tr[tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    input,
    select,
    textarea {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 10px;
    }

    textarea {
      width: 100%;
      min-height: 78px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: var(--blue);
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .topbar-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .subtle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .status.error {
      color: var(--red);
      font-weight: 650;
    }

    .summary {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 20px 0;
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 10px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      min-width: 0;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value.good {
      color: var(--green);
    }

    .metric-value.warn {
      color: var(--amber);
    }

    .metric-value.bad {
      color: var(--red);
    }

    .workspace {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 20px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      flex: 1;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .balances-panel .panel-header {
      flex-wrap: nowrap;
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .balances-panel .filters {
      flex: 1 1 auto;
      flex-wrap: nowrap;
      justify-content: flex-end;
      min-width: 0;
    }

    .sort-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .search {
      width: min(100%, 250px);
    }

    .balances-panel .search {
      flex: 1 1 180px;
      max-width: 250px;
    }

    .balances-panel .filters select {
      flex: 0 0 190px;
      min-width: 0;
    }

    .balances-panel .sort-control select {
      flex-basis: 180px;
    }

    .check {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      min-height: 36px;
    }

    .check.wide {
      grid-column: 1 / -1;
    }

    .table-wrap {
      overflow: auto;
      max-height: 620px;
    }

    .balances-panel .table-wrap {
      height: var(--balance-list-height);
      max-height: var(--balance-list-height);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 7px 9px;
      border-bottom: 1px solid #e7ebf0;
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 12px;
      font-weight: 740;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .balances-panel th {
      height: var(--balance-header-height);
      padding-top: 0;
      padding-bottom: 0;
    }

    .balances-panel td {
      height: var(--balance-row-height);
      padding-top: 0;
      padding-bottom: 0;
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    tbody tr {
      cursor: pointer;
    }

    .balances-panel tbody tr {
      height: var(--balance-row-height);
    }

    tbody tr:hover {
      background: #f2f6fb;
    }

    tbody tr.selected {
      background: #eaf2ff;
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .chapter-cell {
      display: grid;
      gap: 1px;
      min-width: 0;
    }

    .balances-panel .chapter-cell {
      gap: 0;
    }

    .code {
      font-weight: 760;
      color: var(--text);
    }

    .balances-panel .code {
      line-height: 1.15;
    }

    .name {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .balances-panel .name {
      line-height: 1.15;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      min-height: 22px;
      max-width: 100%;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700;
      background: #eef2f6;
      color: #354152;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill.good {
      background: #e6f4ec;
      color: var(--green);
    }

    .pill.warn {
      background: #fff4df;
      color: var(--amber);
    }

    .pill.bad {
      background: #fdebea;
      color: var(--red);
    }

    .detail {
      width: 100%;
    }

    .detail-head {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .detail-title {
      margin: 0;
      font-size: 20px;
      font-weight: 780;
      letter-spacing: 0;
    }

    .detail-name {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .mini {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px;
      background: var(--panel-soft);
      min-width: 0;
    }

    .mini-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .mini-value {
      margin-top: 3px;
      font-weight: 760;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab {
      border-color: transparent;
      background: transparent;
      min-height: 32px;
      padding: 5px 10px;
    }

    .tab.active {
      background: #eaf2ff;
      border-color: #bdd2f3;
      color: var(--blue);
      font-weight: 760;
    }

    .detail-tools {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .detail-body {
      min-height: 320px;
      max-height: 620px;
      overflow: auto;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .loading {
      opacity: .72;
      pointer-events: none;
    }

    .positive {
      color: var(--green);
      font-weight: 720;
    }

    .negative {
      color: var(--red);
      font-weight: 720;
    }

    .fineprint {
      color: var(--muted);
      font-size: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(24, 32, 43, .42);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      width: min(720px, 100%);
      max-height: min(860px, calc(100vh - 36px));
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, .24);
    }

    .modal-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .modal-title {
      margin: 0;
      font-size: 16px;
      font-weight: 780;
      letter-spacing: 0;
    }

    .form-grid {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .field input,
    .field select {
      width: 100%;
    }

    .notice {
      margin: 0 14px 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-soft);
      color: var(--text);
      font-size: 13px;
    }

    .notice.error {
      border-color: #efc2bf;
      background: #fff3f2;
      color: var(--red);
      font-weight: 650;
    }

    .notice.warn {
      border-color: #eed19a;
      background: #fff8ea;
      color: var(--amber);
      font-weight: 650;
    }

    .notice.success {
      border-color: #b7dec8;
      background: #effaf3;
      color: var(--green);
      font-weight: 650;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .preview-item {
      min-width: 0;
    }

    .preview-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .preview-value {
      margin-top: 2px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .form-actions {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .receipt-list {
      display: grid;
      gap: 8px;
      margin: 0 14px 14px;
    }

    .receipt-row {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      background: var(--panel-soft);
    }

    .receipt-name {
      font-weight: 720;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .receipt-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .receipt-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mobile-detail-button {
      display: none;
    }

    @media (max-width: 1120px) {
      .summary {
        grid-template-columns: repeat(3, minmax(130px, 1fr));
      }
    }

    @media (max-width: 720px) {
      .topbar-inner {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .summary {
        padding: 12px 12px 0;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .workspace {
        padding: 12px;
      }

      .panel-header {
        align-items: stretch;
      }

      .balances-panel .panel-header,
      .balances-panel .filters {
        flex-wrap: wrap;
      }

      .balances-panel .filters {
        justify-content: flex-start;
      }

      .sort-control {
        width: 100%;
      }

      .filters,
      .search,
      .filters select {
        width: 100%;
      }

      .check {
        width: 100%;
      }

      .detail-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .form-grid,
      .preview-grid {
        grid-template-columns: 1fr;
      }

      .receipt-row {
        grid-template-columns: 1fr;
      }

      th,
      td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title-block">
          <h1>Chapter Rewards</h1>
          <div class="subtle" id="reportMeta">Loading balances</div>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" type="button">Refresh</button>
          <button id="exportBalancesBtn" type="button">Export CSV</button>
        </div>
      </div>
    </header>

    <section class="summary" aria-label="Rewards summary">
      <div class="metric">
        <div class="metric-label">Available</div>
        <div class="metric-value good" id="summaryAvailable">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">Value</div>
        <div class="metric-value" id="summaryValue">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">Chapters</div>
        <div class="metric-value" id="summaryChapters">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">Credits</div>
        <div class="metric-value" id="summaryCredits">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">Debits</div>
        <div class="metric-value" id="summaryDebits">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">Expiring 30</div>
        <div class="metric-value warn" id="summaryExpiring">-</div>
      </div>
    </section>

    <main class="workspace">
      <section class="panel balances-panel" aria-label="Chapter balances">
        <div class="panel-header">
          <h2 class="panel-title">Balances</h2>
          <div class="filters">
            <input class="search" id="searchInput" type="search" list="chapterSearchOptions" placeholder="Search chapters" autocomplete="off">
            <datalist id="chapterSearchOptions"></datalist>
            <label class="sort-control" for="sortSelect">
              <span>Sort by:</span>
              <select id="sortSelect" aria-label="Sort balances">
                <option value="activity_desc">Recent Activity</option>
                <option value="name_asc">Chapter Name</option>
                <option value="code_asc">Chapter Code</option>
                <option value="available_desc">Points available</option>
                <option value="expiring_desc">Points expiring soon</option>
              </select>
            </label>
            <label class="check"><input id="nonzeroOnly" type="checkbox" checked> Nonzero</label>
            <label class="check"><input id="expiringOnly" type="checkbox"> Expiring</label>
          </div>
        </div>
        <div class="table-wrap" id="balancesTableWrap">
          <table>
            <colgroup>
              <col style="width: 28%">
              <col style="width: 12%">
              <col style="width: 11%">
              <col style="width: 11%">
              <col style="width: 10%">
              <col style="width: 10%">
              <col style="width: 10%">
              <col style="width: 8%">
            </colgroup>
            <thead>
              <tr>
                <th>Chapter</th>
                <th class="num">Available</th>
                <th class="num">Value</th>
                <th class="num">Earned 30</th>
                <th class="num">Used 30</th>
                <th class="num">Exp 30</th>
                <th>Next Exp</th>
                <th class="num">Multiplier</th>
              </tr>
            </thead>
            <tbody id="balancesBody">
              <tr><td colspan="8" class="empty">Loading</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel detail" aria-label="Chapter detail">
        <div id="detailContent" class="empty">No chapter selected</div>
      </section>
    </main>

    <div class="modal-backdrop" id="debitModal" hidden>
      <form class="modal" id="debitForm">
        <div class="modal-head">
          <h2 class="modal-title">Manual Debit</h2>
          <button id="closeDebitBtn" type="button">Close</button>
        </div>
        <div class="form-grid">
          <div class="field wide">
            <label for="debitChapter">Chapter</label>
            <select id="debitChapter" required></select>
          </div>
          <div class="field">
            <label for="debitDate">Request Date</label>
            <input id="debitDate" type="date" required>
          </div>
          <div class="field">
            <label for="debitPoints">Points</label>
            <input id="debitPoints" type="number" min="1" step="1" inputmode="numeric" required>
          </div>
          <div class="field">
            <label for="debitCategory">Category</label>
            <select id="debitCategory" required>
              <option value="go_promotion">Go promotion</option>
              <option value="chapter_renewal">Chapter renewal</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="debitPaymentMode">Payment</label>
            <select id="debitPaymentMode" required>
              <option value="reimbursement">Reimbursement</option>
              <option value="dues_credit">Dues credit</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field wide">
            <label for="debitDescription">Description</label>
            <input id="debitDescription" type="text" maxlength="512" required>
          </div>
          <div class="field wide">
            <label for="debitReceipts">Receipts</label>
            <input id="debitReceipts" type="file" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.pdf" multiple>
            <div class="fineprint" id="debitReceiptSummary"></div>
          </div>
          <div class="field">
            <label for="debitRequestId">Request ID</label>
            <input id="debitRequestId" type="text" maxlength="64">
          </div>
          <div class="field wide">
            <label for="debitNotes">Notes</label>
            <textarea id="debitNotes" maxlength="4000"></textarea>
          </div>
          <label class="check wide">
            <input id="debitConfirm" type="checkbox">
            Approved for posting
          </label>
        </div>
        <div id="debitNotice"></div>
        <div class="form-actions">
          <span class="fineprint" id="debitOperator"></span>
          <div class="action-group">
            <button id="previewDebitBtn" type="button">Preview</button>
            <button id="postDebitBtn" class="primary" type="submit" disabled>Post Debit</button>
          </div>
        </div>
      </form>
    </div>

    <div class="modal-backdrop" id="receiptModal" hidden>
      <form class="modal" id="receiptForm">
        <div class="modal-head">
          <h2 class="modal-title">Receipts</h2>
          <button id="closeReceiptBtn" type="button">Close</button>
        </div>
        <div class="form-grid">
          <div class="field wide">
            <label>Redemption</label>
            <div class="fineprint" id="receiptRedemptionMeta"></div>
          </div>
          <div class="field wide">
            <label for="receiptNotes">Notes</label>
            <textarea id="receiptNotes" maxlength="4000"></textarea>
          </div>
          <div class="field wide">
            <label for="receiptFiles">Upload</label>
            <input id="receiptFiles" type="file" accept="image/*,.pdf" multiple>
          </div>
        </div>
        <div id="receiptNotice"></div>
        <div id="receiptList" class="receipt-list"></div>
        <div class="form-actions">
          <span class="fineprint" id="receiptOperator"></span>
          <div class="action-group">
            <button id="saveReceiptNotesBtn" type="button">Save Notes</button>
            <button id="uploadReceiptsBtn" class="primary" type="button">Upload Receipts</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const isAdminPage = /\/admin\/?$/.test(window.location.pathname);
    const apiRoot = window.location.pathname.replace(/\/admin\/?$/, "").replace(/\/$/, "");
    const state = {
      balances: [],
      filtered: [],
      summary: null,
      generatedAt: null,
      selectedCode: null,
      detail: null,
      detailLoading: false,
      tab: "ledger",
      sourceFilter: "all",
      admin: null,
      adminChapters: [],
      debitPreview: null,
      debitPosted: null,
      debitError: null,
      debitUploadWarning: null,
      debitBusy: false,
      activeRedemption: null,
      receiptError: null,
      receiptBusy: false,
      error: null
    };

    const els = {
      app: document.getElementById("app"),
      reportMeta: document.getElementById("reportMeta"),
      refreshBtn: document.getElementById("refreshBtn"),
      exportBalancesBtn: document.getElementById("exportBalancesBtn"),
      summaryAvailable: document.getElementById("summaryAvailable"),
      summaryValue: document.getElementById("summaryValue"),
      summaryChapters: document.getElementById("summaryChapters"),
      summaryCredits: document.getElementById("summaryCredits"),
      summaryDebits: document.getElementById("summaryDebits"),
      summaryExpiring: document.getElementById("summaryExpiring"),
      searchInput: document.getElementById("searchInput"),
      chapterSearchOptions: document.getElementById("chapterSearchOptions"),
      sortSelect: document.getElementById("sortSelect"),
      nonzeroOnly: document.getElementById("nonzeroOnly"),
      expiringOnly: document.getElementById("expiringOnly"),
      balancesTableWrap: document.getElementById("balancesTableWrap"),
      balancesBody: document.getElementById("balancesBody"),
      detailContent: document.getElementById("detailContent"),
      debitModal: document.getElementById("debitModal"),
      debitForm: document.getElementById("debitForm"),
      closeDebitBtn: document.getElementById("closeDebitBtn"),
      debitChapter: document.getElementById("debitChapter"),
      debitDate: document.getElementById("debitDate"),
      debitPoints: document.getElementById("debitPoints"),
      debitCategory: document.getElementById("debitCategory"),
      debitPaymentMode: document.getElementById("debitPaymentMode"),
      debitDescription: document.getElementById("debitDescription"),
      debitReceipts: document.getElementById("debitReceipts"),
      debitReceiptSummary: document.getElementById("debitReceiptSummary"),
      debitRequestId: document.getElementById("debitRequestId"),
      debitNotes: document.getElementById("debitNotes"),
      debitConfirm: document.getElementById("debitConfirm"),
      debitNotice: document.getElementById("debitNotice"),
      debitOperator: document.getElementById("debitOperator"),
      previewDebitBtn: document.getElementById("previewDebitBtn"),
      postDebitBtn: document.getElementById("postDebitBtn"),
      receiptModal: document.getElementById("receiptModal"),
      receiptForm: document.getElementById("receiptForm"),
      closeReceiptBtn: document.getElementById("closeReceiptBtn"),
      receiptRedemptionMeta: document.getElementById("receiptRedemptionMeta"),
      receiptNotes: document.getElementById("receiptNotes"),
      receiptFiles: document.getElementById("receiptFiles"),
      receiptNotice: document.getElementById("receiptNotice"),
      receiptList: document.getElementById("receiptList"),
      receiptOperator: document.getElementById("receiptOperator"),
      saveReceiptNotesBtn: document.getElementById("saveReceiptNotesBtn"),
      uploadReceiptsBtn: document.getElementById("uploadReceiptsBtn")
    };

    function points(value) {
      return Number(value || 0).toLocaleString("en-US");
    }

    function moneyFromPoints(value) {
      return "$" + (Number(value || 0) / 1000).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function dateOnly(value) {
      if (!value) return "";
      const text = String(value);
      return text.length >= 10 ? text.slice(0, 10) : text;
    }

    function dateTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).replace("T", " ").slice(0, 19);
      return date.toLocaleString("en-US", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function labelize(value) {
      return String(value || "")
        .replaceAll("_", " ")
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function signedPoints(value) {
      const n = Number(value || 0);
      if (n > 0) return "+" + points(n);
      return points(n);
    }

    function html(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    async function getJson(url) {
      const response = await fetch(url, { headers: { "Accept": "application/json" }, cache: "no-store" });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `Request failed with ${response.status}`);
      }
      return await response.json();
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
        cache: "no-store",
        body: JSON.stringify(body)
      });
      const text = await response.text();
      let payload = null;
      if (text) {
        try {
          payload = JSON.parse(text);
        } catch {
          payload = null;
        }
      }
      if (!response.ok) {
        throw new Error((payload && payload.error) || text || `Request failed with ${response.status}`);
      }
      return payload || {};
    }

    function todayInputValue() {
      const value = new Date();
      value.setMinutes(value.getMinutes() - value.getTimezoneOffset());
      return value.toISOString().slice(0, 10);
    }

    async function loadBalances({ keepSelection = true } = {}) {
      state.error = null;
      setLoading(true);
      try {
        const payload = await getJson(`${apiRoot}/balances`);
        state.balances = Array.isArray(payload.chapters) ? payload.chapters : [];
        state.summary = payload.summary || null;
        state.generatedAt = payload.generated_at || null;
        const requested = new URLSearchParams(window.location.search).get("chapter");
        const previous = keepSelection ? state.selectedCode : null;
        renderChapterSearchOptions();
        applyFilters();
        const nextSelection = requested || previous || (state.filtered[0] && state.filtered[0].chapter_code);
        render();
        if (nextSelection) {
          await selectChapter(nextSelection, { replaceUrl: false });
        }
      } catch (error) {
        state.error = error.message || String(error);
        render();
      } finally {
        setLoading(false);
      }
    }

    async function selectChapter(chapterCode, { replaceUrl = true, syncSearch = true } = {}) {
      if (!chapterCode) return;
      state.selectedCode = chapterCode;
      if (syncSearch) {
        syncSearchInputToSelectedChapter();
        applyFilters();
      }
      state.detailLoading = true;
      state.detail = null;
      renderBalances();
      scrollSelectedChapterIntoView();
      renderDetail();
      try {
        const payload = await getJson(`${apiRoot}/chapter?chapter_code=${encodeURIComponent(chapterCode)}&limit=300`);
        state.detail = payload;
        if (replaceUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("chapter", chapterCode);
          window.history.replaceState({}, "", url);
        }
      } catch (error) {
        state.detail = { ok: false, error: error.message || String(error) };
      } finally {
        state.detailLoading = false;
        renderBalances();
        scrollSelectedChapterIntoView();
        renderDetail();
      }
    }

    async function initializeAdmin() {
      if (isAdminPage) {
        try {
          await loadAdminOptions();
          openDebitModal();
        } catch (error) {
          state.error = error.message || String(error);
          render();
        }
        return;
      }
      try {
        const payload = await getJson(`${apiRoot}/admin/me`);
        if (payload.ok) {
          state.admin = payload.authorization || null;
          renderDetail();
        }
      } catch {
        state.admin = null;
      }
    }

    async function loadAdminOptions() {
      const payload = await getJson(`${apiRoot}/admin/options`);
      state.admin = payload.authorization || state.admin;
      state.adminChapters = Array.isArray(payload.chapters) ? payload.chapters : [];
      renderDebitChapterOptions();
      renderDetail();
    }

    function renderDebitChapterOptions() {
      const chapters = state.adminChapters.length ? state.adminChapters : state.balances.map(row => ({
        chapter_id: null,
        chapter_code: row.chapter_code,
        chapter_name: row.chapter_name,
        available_points: row.available_points
      }));
      els.debitChapter.innerHTML = chapters.map(chapter => {
        const label = `${chapter.chapter_code || ""} - ${chapter.chapter_name || ""} (${points(chapter.available_points)} pts)`;
        return `<option value="${html(chapter.chapter_code)}" data-chapter-id="${html(chapter.chapter_id || "")}">${html(label)}</option>`;
      }).join("");
      if (state.selectedCode) {
        els.debitChapter.value = state.selectedCode;
      }
    }

    function resetDebitForm() {
      state.debitPreview = null;
      state.debitPosted = null;
      state.debitError = null;
      state.debitUploadWarning = null;
      state.debitBusy = false;
      els.debitDate.value = todayInputValue();
      els.debitPoints.value = "";
      els.debitCategory.value = "go_promotion";
      els.debitPaymentMode.value = "reimbursement";
      els.debitDescription.value = "";
      els.debitReceipts.value = "";
      renderDebitReceiptSummary();
      els.debitRequestId.value = "";
      els.debitNotes.value = "";
      els.debitConfirm.checked = false;
      renderDebitChapterOptions();
      renderDebitNotice();
    }

    async function openDebitModal() {
      resetDebitForm();
      els.debitModal.hidden = false;
      els.debitOperator.textContent = state.admin && state.admin.principal_name ? state.admin.principal_name : "";
      if (!state.adminChapters.length) {
        try {
          await loadAdminOptions();
        } catch (error) {
          state.debitError = error.message || String(error);
          renderDebitNotice();
          return;
        }
      }
      window.setTimeout(() => els.debitChapter.focus(), 0);
    }

    function closeDebitModal() {
      els.debitModal.hidden = true;
    }

    function clearDebitPreview() {
      state.debitPreview = null;
      state.debitPosted = null;
      state.debitError = null;
      state.debitUploadWarning = null;
      renderDebitNotice();
    }

    function selectedDebitReceiptFiles() {
      return Array.from(els.debitReceipts.files || []);
    }

    function receiptReferenceFromFiles(files) {
      return files.map(file => file.name).filter(Boolean).join(", ").slice(0, 256);
    }

    function renderDebitReceiptSummary() {
      const files = selectedDebitReceiptFiles();
      if (!files.length) {
        els.debitReceiptSummary.textContent = "";
        return;
      }
      const names = files.map(file => file.name).filter(Boolean);
      const shown = names.slice(0, 3).join(", ");
      const suffix = names.length > 3 ? `, +${names.length - 3} more` : "";
      els.debitReceiptSummary.textContent = `${points(files.length)} selected: ${shown}${suffix}`;
    }

    function readDebitForm() {
      const selected = els.debitChapter.selectedOptions[0];
      const chapterId = selected && selected.dataset.chapterId ? Number(selected.dataset.chapterId) : null;
      const receiptFiles = selectedDebitReceiptFiles();
      return {
        chapter_id: chapterId,
        chapter_code: els.debitChapter.value,
        request_date: els.debitDate.value,
        points: els.debitPoints.value,
        redemption_category: els.debitCategory.value,
        payment_mode: els.debitPaymentMode.value,
        description: els.debitDescription.value,
        receipt_reference: receiptReferenceFromFiles(receiptFiles),
        external_request_id: els.debitRequestId.value,
        notes: els.debitNotes.value
      };
    }

    async function previewDebit() {
      state.debitBusy = true;
      state.debitError = null;
      state.debitPosted = null;
      renderDebitNotice();
      try {
        const payload = await postJson(`${apiRoot}/admin/debit-preview`, readDebitForm());
        state.debitPreview = payload.preview || null;
      } catch (error) {
        state.debitError = error.message || String(error);
      } finally {
        state.debitBusy = false;
        renderDebitNotice();
      }
    }

    async function postDebit() {
      state.debitBusy = true;
      state.debitError = null;
      state.debitUploadWarning = null;
      renderDebitNotice();
      try {
        const receiptFiles = selectedDebitReceiptFiles();
        const body = { ...readDebitForm(), confirm_debit: true };
        const payload = await postJson(`${apiRoot}/admin/debit`, body);
        state.debitPosted = payload.debit || null;
        state.debitPreview = null;
        els.debitRequestId.value = state.debitPosted && state.debitPosted.external_request_id || els.debitRequestId.value;
        if (receiptFiles.length && state.debitPosted && state.debitPosted.redemption_id) {
          try {
            const uploadPayload = await uploadReceiptFiles(state.debitPosted.redemption_id, receiptFiles);
            const receipts = uploadPayload.receipts || [];
            state.debitPosted.active_receipt_count = receipts.length;
            state.debitPosted.receipts = receipts;
            els.debitReceipts.value = "";
            renderDebitReceiptSummary();
          } catch (uploadError) {
            state.debitUploadWarning = `Debit posted, but receipt upload failed: ${uploadError.message || String(uploadError)}`;
          }
        } else if (receiptFiles.length) {
          state.debitUploadWarning = "Debit posted, but the posted redemption could not be reloaded for receipt upload.";
        }
        await loadBalances({ keepSelection: true });
        const code = state.debitPosted && state.debitPosted.chapter_code;
        if (code) await selectChapter(code);
      } catch (error) {
        state.debitError = error.message || String(error);
      } finally {
        state.debitBusy = false;
        renderDebitNotice();
      }
    }

    function renderDebitNotice() {
      els.previewDebitBtn.disabled = state.debitBusy;
      const canPost = state.debitPreview
        && !state.debitPreview.insufficient_balance_count
        && !state.debitPreview.already_posted_count
        && els.debitConfirm.checked
        && !state.debitBusy;
      els.postDebitBtn.disabled = !canPost;

      if (state.debitError) {
        els.debitNotice.innerHTML = `<div class="notice error">${html(state.debitError)}</div>`;
        return;
      }
      if (state.debitPosted) {
        const receiptCount = Number(state.debitPosted.active_receipt_count || (state.debitPosted.receipts || []).length || 0);
        const receiptText = receiptCount ? ` ${points(receiptCount)} receipt file${receiptCount === 1 ? "" : "s"} attached.` : "";
        const reviewButton = state.debitPosted.redemption_id
          ? ` <button type="button" data-manage-posted-redemption="${html(state.debitPosted.redemption_id)}">Review Receipts</button>`
          : "";
        const uploadWarning = state.debitUploadWarning ? `<div class="notice warn">${html(state.debitUploadWarning)}</div>` : "";
        els.debitNotice.innerHTML = `<div class="notice success">Posted ${points(state.debitPosted.points)} points for ${html(state.debitPosted.chapter_code)}. Transaction ${html(state.debitPosted.transaction_id || "")}.${receiptText}${reviewButton}</div>${uploadWarning}`;
        return;
      }
      if (!state.debitPreview) {
        els.debitNotice.innerHTML = "";
        return;
      }
      const preview = state.debitPreview;
      const className = preview.insufficient_balance_count ? "notice warn" : "notice";
      const status = preview.insufficient_balance_count
        ? `Short ${points(preview.shortfall_points)} points`
        : `After debit ${points(preview.available_after_points)} points`;
      els.debitNotice.innerHTML = `
        <div class="${className}">
          <div class="preview-grid">
            <div class="preview-item">
              <div class="preview-label">Available</div>
              <div class="preview-value">${points(preview.available_points)}</div>
            </div>
            <div class="preview-item">
              <div class="preview-label">Debit</div>
              <div class="preview-value">${points(preview.points)}</div>
            </div>
            <div class="preview-item">
              <div class="preview-label">Value</div>
              <div class="preview-value">${moneyFromPoints(preview.points)}</div>
            </div>
            <div class="preview-item">
              <div class="preview-label">Result</div>
              <div class="preview-value">${html(status)}</div>
            </div>
          </div>
        </div>
      `;
    }

    async function openReceiptModal(redemptionId) {
      if (!redemptionId) return;
      state.activeRedemption = null;
      state.receiptError = null;
      state.receiptBusy = true;
      els.receiptModal.hidden = false;
      els.receiptFiles.value = "";
      els.receiptOperator.textContent = state.admin && state.admin.principal_name ? state.admin.principal_name : "";
      renderReceiptModal();
      try {
        await loadAdminRedemption(redemptionId);
      } catch (error) {
        state.receiptError = error.message || String(error);
      } finally {
        state.receiptBusy = false;
        renderReceiptModal();
      }
    }

    function closeReceiptModal() {
      els.receiptModal.hidden = true;
      state.activeRedemption = null;
      state.receiptError = null;
    }

    async function loadAdminRedemption(redemptionId) {
      const payload = await getJson(`${apiRoot}/admin/redemption?redemption_id=${encodeURIComponent(redemptionId)}`);
      state.activeRedemption = payload.redemption || null;
      els.receiptNotes.value = state.activeRedemption && state.activeRedemption.notes || "";
    }

    function receiptSize(bytes) {
      const value = Number(bytes || 0);
      if (value >= 1024 * 1024) return (value / (1024 * 1024)).toFixed(1) + " MB";
      if (value >= 1024) return Math.round(value / 1024) + " KB";
      return value + " B";
    }

    function renderReceiptModal() {
      els.saveReceiptNotesBtn.disabled = state.receiptBusy || !state.activeRedemption;
      els.uploadReceiptsBtn.disabled = state.receiptBusy || !state.activeRedemption;
      const redemption = state.activeRedemption;
      if (!redemption) {
        els.receiptRedemptionMeta.textContent = state.receiptBusy ? "Loading" : "";
        els.receiptNotice.innerHTML = state.receiptError ? `<div class="notice error">${html(state.receiptError)}</div>` : "";
        els.receiptList.innerHTML = "";
        return;
      }
      els.receiptRedemptionMeta.textContent = `${redemption.chapter_code} ${dateOnly(redemption.request_date)} - ${points(redemption.points)} points - ${redemption.description || labelize(redemption.redemption_category)}`;
      if (state.receiptError) {
        els.receiptNotice.innerHTML = `<div class="notice error">${html(state.receiptError)}</div>`;
      } else {
        els.receiptNotice.innerHTML = "";
      }
      const receipts = redemption.receipts || [];
      if (!receipts.length) {
        els.receiptList.innerHTML = `<div class="empty">No receipts</div>`;
        return;
      }
      els.receiptList.innerHTML = receipts.map(receipt => `
        <div class="receipt-row">
          <div>
            <div class="receipt-name">${html(receipt.original_file_name)}</div>
            <div class="receipt-meta">${html(dateTime(receipt.uploaded_at))} - ${html(receipt.content_type)} - ${receiptSize(receipt.content_length)}</div>
          </div>
          <div class="receipt-actions">
            <a class="button-link" href="${html(receipt.url)}" target="_blank" rel="noopener">View</a>
            <button type="button" data-delete-receipt="${html(receipt.receipt_id)}">Remove</button>
          </div>
        </div>
      `).join("");
    }

    async function fileToDataUrl(file) {
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("File read failed"));
        reader.readAsDataURL(file);
      });
    }

    async function receiptPayloadsFromFiles(files) {
      const payloadFiles = [];
      for (const file of files) {
        payloadFiles.push({
          name: file.name,
          content_type: file.type || "",
          data_url: await fileToDataUrl(file)
        });
      }
      return payloadFiles;
    }

    async function uploadReceiptFiles(redemptionId, files) {
      return await postJson(`${apiRoot}/admin/receipt-upload`, {
        redemption_id: redemptionId,
        files: await receiptPayloadsFromFiles(files)
      });
    }

    async function uploadReceipts() {
      if (!state.activeRedemption) return;
      const files = Array.from(els.receiptFiles.files || []);
      if (!files.length) {
        state.receiptError = "Choose one or more receipt files.";
        renderReceiptModal();
        return;
      }
      state.receiptBusy = true;
      state.receiptError = null;
      renderReceiptModal();
      try {
        await uploadReceiptFiles(state.activeRedemption.redemption_id, files);
        els.receiptFiles.value = "";
        await loadAdminRedemption(state.activeRedemption.redemption_id);
        await refreshSelectedChapter();
      } catch (error) {
        state.receiptError = error.message || String(error);
      } finally {
        state.receiptBusy = false;
        renderReceiptModal();
      }
    }

    async function saveReceiptNotes() {
      if (!state.activeRedemption) return;
      state.receiptBusy = true;
      state.receiptError = null;
      renderReceiptModal();
      try {
        await postJson(`${apiRoot}/admin/redemption-notes`, {
          redemption_id: state.activeRedemption.redemption_id,
          notes: els.receiptNotes.value
        });
        await loadAdminRedemption(state.activeRedemption.redemption_id);
      } catch (error) {
        state.receiptError = error.message || String(error);
      } finally {
        state.receiptBusy = false;
        renderReceiptModal();
      }
    }

    async function deleteReceipt(receiptId) {
      if (!state.activeRedemption || !receiptId) return;
      state.receiptBusy = true;
      state.receiptError = null;
      renderReceiptModal();
      try {
        await postJson(`${apiRoot}/admin/receipt-delete`, { receipt_id: receiptId });
        await loadAdminRedemption(state.activeRedemption.redemption_id);
        await refreshSelectedChapter();
      } catch (error) {
        state.receiptError = error.message || String(error);
      } finally {
        state.receiptBusy = false;
        renderReceiptModal();
      }
    }

    async function refreshSelectedChapter() {
      if (state.selectedCode) {
        await selectChapter(state.selectedCode, { replaceUrl: false });
      }
    }

    function setLoading(isLoading) {
      els.app.classList.toggle("loading", isLoading);
    }

    function chapterSearchText(row) {
      return `${row.chapter_code || ""} ${row.chapter_name || ""}`.trim();
    }

    function normalizeSearchText(value) {
      return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
    }

    function findBalanceByChapterCode(chapterCode) {
      const target = String(chapterCode || "").trim().toLowerCase();
      if (!target) return null;
      return state.balances.find(row => String(row.chapter_code || "").trim().toLowerCase() === target) || null;
    }

    function findBalanceBySearchSelection(value) {
      const target = normalizeSearchText(value);
      if (!target) return null;
      return state.balances.find(row => {
        const code = normalizeSearchText(row.chapter_code);
        return code === target || normalizeSearchText(chapterSearchText(row)) === target;
      }) || null;
    }

    function syncSearchInputToSelectedChapter() {
      const row = findBalanceByChapterCode(state.selectedCode);
      if (!row) return;
      const label = chapterSearchText(row);
      if (els.searchInput.value !== label) {
        els.searchInput.value = label;
        renderChapterSearchOptions();
      }
    }

    function clearChapterSelection({ clearSearch = false, replaceUrl = true } = {}) {
      state.selectedCode = null;
      state.detail = null;
      state.detailLoading = false;
      state.tab = "ledger";
      state.sourceFilter = "all";
      if (clearSearch) {
        els.searchInput.value = "";
        renderChapterSearchOptions();
      }
      if (replaceUrl) {
        const url = new URL(window.location.href);
        url.searchParams.delete("chapter");
        window.history.replaceState({}, "", url);
      }
    }

    function renderChapterSearchOptions() {
      const search = els.searchInput.value.trim().toLowerCase();
      const rows = state.balances
        .filter(row => {
          if (!search) return true;
          return chapterSearchText(row).toLowerCase().includes(search);
        })
        .sort((a, b) => String(a.chapter_name || "").localeCompare(String(b.chapter_name || "")) || String(a.chapter_code || "").localeCompare(String(b.chapter_code || "")))
        .slice(0, 80);
      els.chapterSearchOptions.innerHTML = rows.map(row => `<option value="${html(chapterSearchText(row))}"></option>`).join("");
    }

    function applyFilters() {
      const selectedSearchRow = findBalanceBySearchSelection(els.searchInput.value);
      const search = selectedSearchRow ? "" : els.searchInput.value.trim().toLowerCase();
      const nonzeroOnly = els.nonzeroOnly.checked;
      const expiringOnly = els.expiringOnly.checked;
      let rows = state.balances.filter(row => {
        const haystack = chapterSearchText(row).toLowerCase();
        if (search && !haystack.includes(search)) return false;
        if (nonzeroOnly && !row.available_points && !row.ledger_balance) return false;
        if (expiringOnly && !row.expiring_30_days && !row.expiring_60_days && !row.expiring_90_days) return false;
        return true;
      });
      if (selectedSearchRow && !rows.some(row => row.chapter_code === selectedSearchRow.chapter_code)) {
        rows = rows.concat([selectedSearchRow]);
      }
      const sort = els.sortSelect.value;
      rows.sort((a, b) => {
        const codeSort = String(a.chapter_code || "").localeCompare(String(b.chapter_code || ""));
        if (sort === "name_asc") return String(a.chapter_name || "").localeCompare(String(b.chapter_name || "")) || codeSort;
        if (sort === "code_asc") return codeSort;
        if (sort === "available_desc") return (b.available_points || 0) - (a.available_points || 0) || codeSort;
        if (sort === "expiring_desc") return (b.expiring_30_days || 0) - (a.expiring_30_days || 0) || (b.expiring_60_days || 0) - (a.expiring_60_days || 0) || (b.expiring_90_days || 0) - (a.expiring_90_days || 0) || codeSort;
        return String(b.last_transaction_posted_at || "").localeCompare(String(a.last_transaction_posted_at || "")) || codeSort;
      });
      state.filtered = rows;
    }

    function scrollSelectedChapterIntoView() {
      if (!state.selectedCode) return;
      const row = Array.from(els.balancesBody.querySelectorAll("tr[data-chapter]"))
        .find(item => item.dataset.chapter === state.selectedCode);
      if (!row) return;
      row.scrollIntoView({ block: "nearest" });
    }

    async function handleChapterSearchInput() {
      renderChapterSearchOptions();
      const selectedSearchRow = findBalanceBySearchSelection(els.searchInput.value);
      if (selectedSearchRow) {
        await selectChapter(selectedSearchRow.chapter_code);
        return;
      }
      applyFilters();
      els.balancesTableWrap.scrollTop = 0;
      renderBalances();
    }

    function openChapterSearchPicker() {
      if (typeof els.searchInput.showPicker !== "function") return false;
      try {
        els.searchInput.showPicker();
        return true;
      } catch {
        return false;
      }
    }

    function handleChapterSearchKeydown(event) {
      if (event.key !== "ArrowDown") return;
      const selectedSearchRow = findBalanceBySearchSelection(els.searchInput.value);
      if (!selectedSearchRow) return;
      els.searchInput.value = "";
      renderChapterSearchOptions();
      applyFilters();
      renderBalances();
      scrollSelectedChapterIntoView();
      if (openChapterSearchPicker()) {
        event.preventDefault();
      }
    }

    function handleSortChange() {
      const hadSelection = Boolean(state.selectedCode);
      if (hadSelection) {
        clearChapterSelection({ clearSearch: true });
      }
      refreshBalanceFilterView();
      if (hadSelection) {
        renderDetail();
      }
    }

    function refreshBalanceFilterView() {
      applyFilters();
      const selectedSearchRow = findBalanceBySearchSelection(els.searchInput.value);
      if (!selectedSearchRow) {
        els.balancesTableWrap.scrollTop = 0;
      }
      renderBalances();
      if (selectedSearchRow) {
        scrollSelectedChapterIntoView();
      }
    }

    function render() {
      renderSummary();
      renderBalances();
      renderDetail();
    }

    function renderSummary() {
      const summary = state.summary || {};
      els.summaryAvailable.textContent = points(summary.available_points);
      els.summaryValue.textContent = moneyFromPoints(summary.available_points);
      els.summaryChapters.textContent = points(summary.chapter_count);
      els.summaryCredits.textContent = points(summary.total_credits);
      els.summaryDebits.textContent = points(summary.total_debits);
      els.summaryExpiring.textContent = points(summary.expiring_30_days);
      els.summaryExpiring.classList.toggle("warn", Number(summary.expiring_30_days || 0) > 0);
      els.summaryExpiring.classList.toggle("good", Number(summary.expiring_30_days || 0) === 0);
      if (state.error) {
        els.reportMeta.textContent = state.error;
        els.reportMeta.classList.add("error");
      } else {
        els.reportMeta.classList.remove("error");
        const stamp = state.generatedAt ? dateTime(state.generatedAt) : "";
        els.reportMeta.textContent = stamp ? `Updated ${stamp}` : "Ready";
      }
    }

    function renderBalances() {
      if (state.error) {
        els.balancesBody.innerHTML = `<tr><td colspan="8" class="empty">${html(state.error)}</td></tr>`;
        return;
      }
      if (!state.filtered.length) {
        els.balancesBody.innerHTML = `<tr><td colspan="8" class="empty">No balances</td></tr>`;
        return;
      }
      const previousScrollTop = els.balancesTableWrap.scrollTop;
      els.balancesBody.innerHTML = state.filtered.map(row => {
        const selected = row.chapter_code === state.selectedCode ? " selected" : "";
        return `
          <tr class="${selected}" tabindex="0" data-chapter="${html(row.chapter_code)}">
            <td>
              <div class="chapter-cell">
                <span class="code">${html(row.chapter_code)}</span>
                <span class="name">${html(row.chapter_name || "")}</span>
              </div>
            </td>
            <td class="num">${points(row.available_points)}</td>
            <td class="num">${moneyFromPoints(row.available_points)}</td>
            <td class="num">${points(row.earned_30_days)}</td>
            <td class="num">${points(row.used_30_days)}</td>
            <td class="num">${points(row.expiring_30_days)}</td>
            <td>${html(dateOnly(row.next_expiration_date))}</td>
            <td class="num">${points(row.multiplier)}</td>
          </tr>
        `;
      }).join("");
      els.balancesTableWrap.scrollTop = previousScrollTop;
    }

    function renderDetail() {
      if (!state.selectedCode) {
        els.detailContent.className = "empty";
        els.detailContent.textContent = "No chapter selected";
        return;
      }
      if (state.detailLoading) {
        els.detailContent.className = "empty";
        els.detailContent.textContent = "Loading";
        return;
      }
      if (state.detail && state.detail.ok === false) {
        els.detailContent.className = "empty";
        els.detailContent.textContent = state.detail.error || "Chapter detail failed";
        return;
      }
      const detail = state.detail;
      if (!detail || !detail.chapter) {
        els.detailContent.className = "empty";
        els.detailContent.textContent = "No chapter selected";
        return;
      }
      const chapter = detail.chapter;
      els.detailContent.className = "";
      els.detailContent.innerHTML = `
        <div class="detail-head">
          <h2 class="detail-title">${html(chapter.chapter_code)}</h2>
          <div class="detail-name">${html(chapter.chapter_name || "")}</div>
          <div class="detail-metrics">
            <div class="mini">
              <div class="mini-label">Available</div>
              <div class="mini-value">${points(chapter.available_points)}</div>
            </div>
            <div class="mini">
              <div class="mini-label">Value</div>
              <div class="mini-value">${moneyFromPoints(chapter.available_points)}</div>
            </div>
            <div class="mini">
              <div class="mini-label">Exp 30</div>
              <div class="mini-value">${points(chapter.expiring_30_days)}</div>
            </div>
            <div class="mini">
              <div class="mini-label">Credits</div>
              <div class="mini-value">${points(chapter.total_credits)}</div>
            </div>
            <div class="mini">
              <div class="mini-label">Debits</div>
              <div class="mini-value">${points(chapter.total_debits)}</div>
            </div>
          </div>
        </div>
        <div class="tabs">
          ${tabButton("ledger", "Ledger")}
          ${tabButton("lots", "Lots")}
          ${tabButton("breakdown", "Breakdown")}
          ${tabButton("redemptions", "Redemptions")}
        </div>
        <div class="detail-tools">
          ${renderDetailTools(detail)}
        </div>
        <div class="detail-body">
          ${renderActiveTab(detail)}
        </div>
      `;
    }

    function tabButton(id, label) {
      return `<button class="tab ${state.tab === id ? "active" : ""}" type="button" data-tab="${id}">${html(label)}</button>`;
    }

    function renderDetailTools(detail) {
      if (state.tab === "ledger") {
        const categories = Array.from(new Map((detail.breakdown || []).map(item => [item.source_category, item.source_label])).entries());
        const options = [`<option value="all">All sources</option>`]
          .concat(categories.map(([value, label]) => `<option value="${html(value)}" ${state.sourceFilter === value ? "selected" : ""}>${html(label)}</option>`))
          .join("");
        return `
          <select id="sourceFilter" aria-label="Source filter">${options}</select>
          <button id="exportActivityBtn" type="button">Export CSV</button>
        `;
      }
      return `<span class="fineprint">Snapshot ${html(dateOnly(detail.chapter.latest_snapshot_date))}</span>`;
    }

    function filteredTransactions(detail) {
      const rows = detail.transactions || [];
      if (state.sourceFilter === "all") return rows;
      return rows.filter(row => row.source_category === state.sourceFilter);
    }

    function renderActiveTab(detail) {
      if (state.tab === "lots") return renderLots(detail.lots || []);
      if (state.tab === "breakdown") return renderBreakdown(detail.breakdown || []);
      if (state.tab === "redemptions") return renderRedemptions(detail.redemptions || []);
      return renderLedger(filteredTransactions(detail));
    }

    function renderLedger(rows) {
      if (!rows.length) return `<div class="empty">No activity</div>`;
      return `
        <table>
          <colgroup>
            <col style="width: 22%">
            <col style="width: 22%">
            <col style="width: 24%">
            <col style="width: 13%">
            <col style="width: 13%">
            <col style="width: 6%">
          </colgroup>
          <thead>
            <tr>
              <th>Effective</th>
              <th>Source</th>
              <th>Detail</th>
              <th class="num">Points</th>
              <th class="num">Balance After</th>
              <th class="num">Items</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td title="Posted ${html(dateTime(row.posted_at))}">${html(dateOnly(row.effective_date))}</td>
                <td><span class="pill">${html(row.source_label)}</span></td>
                <td>${html(row.public_detail)}</td>
                <td class="num ${row.points_delta < 0 ? "negative" : "positive"}">${signedPoints(row.points_delta)}</td>
                <td class="num">${points(row.running_balance)}</td>
                <td class="num">${points(row.entry_count)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderLots(rows) {
      if (!rows.length) return `<div class="empty">No lots</div>`;
      return `
        <table>
          <colgroup>
            <col style="width: 10%">
            <col style="width: 20%">
            <col style="width: 14%">
            <col style="width: 14%">
            <col style="width: 14%">
            <col style="width: 14%">
            <col style="width: 14%">
          </colgroup>
          <thead>
            <tr>
              <th class="num">Lots</th>
              <th>Source</th>
              <th class="num">Original</th>
              <th class="num">Remaining</th>
              <th>Earned</th>
              <th>Expires</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td class="num">${points(row.lot_count)}</td>
                <td>${html(row.source_label)}</td>
                <td class="num">${points(row.original_points)}</td>
                <td class="num">${points(row.remaining_points)}</td>
                <td>${html(dateOnly(row.earned_date))}</td>
                <td>${html(dateOnly(row.expires_on))}</td>
                <td><span class="pill ${lotStatusClass(row.aging_status)}">${html(labelize(row.aging_status))}</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function lotStatusClass(status) {
      if (status === "active") return "good";
      if (status === "expired_unallocated") return "bad";
      if (String(status || "").startsWith("expiring")) return "warn";
      return "";
    }

    function renderBreakdown(rows) {
      if (!rows.length) return `<div class="empty">No breakdown</div>`;
      return `
        <table>
          <colgroup>
            <col style="width: 34%">
            <col style="width: 16%">
            <col style="width: 17%">
            <col style="width: 17%">
            <col style="width: 16%">
          </colgroup>
          <thead>
            <tr>
              <th>Source</th>
              <th class="num">Txns</th>
              <th class="num">Credits</th>
              <th class="num">Debits</th>
              <th class="num">Net</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${html(row.source_label)}</td>
                <td class="num">${points(row.transaction_count)}</td>
                <td class="num positive">${points(row.credit_points)}</td>
                <td class="num negative">${points(row.debit_points)}</td>
                <td class="num">${points(row.net_points)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderRedemptions(rows) {
      if (!rows.length) return `<div class="empty">No redemptions</div>`;
      const adminColumn = state.admin ? `<col style="width: 14%">` : "";
      const adminHeading = state.admin ? `<th>Receipts</th>` : "";
      return `
        <table>
          <colgroup>
            <col style="width: 16%">
            <col style="width: 18%">
            <col style="width: 24%">
            <col style="width: 14%">
            <col style="width: 14%">
            ${adminColumn}
          </colgroup>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Detail</th>
              <th class="num">Points</th>
              <th class="num">Value</th>
              ${adminHeading}
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${html(dateOnly(row.request_date))}</td>
                <td>${html(labelize(row.redemption_category))}</td>
                <td>${html(row.description || labelize(row.payment_mode))}</td>
                <td class="num negative">${points(row.points)}</td>
                <td class="num">${moneyFromPoints(row.points)}</td>
                ${state.admin ? `<td><button type="button" data-manage-redemption="${html(row.redemption_id)}">${points(row.active_receipt_count)} files</button></td>` : ""}
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function toCsv(rows, columns) {
      const escapeCell = value => {
        const text = String(value ?? "");
        return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
      };
      return [
        columns.map(column => escapeCell(column.label)).join(","),
        ...rows.map(row => columns.map(column => escapeCell(column.value(row))).join(","))
      ].join("\r\n");
    }

    function downloadCsv(filename, csv) {
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function exportBalances() {
      const csv = toCsv(state.filtered, [
        { label: "Chapter", value: row => row.chapter_code },
        { label: "Name", value: row => row.chapter_name },
        { label: "Available Points", value: row => row.available_points },
        { label: "Value USD", value: row => (row.available_points || 0) / 1000 },
        { label: "Ledger Balance", value: row => row.ledger_balance },
        { label: "Earned 30 Days", value: row => row.earned_30_days },
        { label: "Used 30 Days", value: row => row.used_30_days },
        { label: "Expiring 30 Days", value: row => row.expiring_30_days },
        { label: "Expiring 60 Days", value: row => row.expiring_60_days },
        { label: "Expiring 90 Days", value: row => row.expiring_90_days },
        { label: "Next Expiration", value: row => dateOnly(row.next_expiration_date) },
        { label: "Active Members", value: row => row.active_member_count },
        { label: "Multiplier", value: row => row.multiplier }
      ]);
      downloadCsv("chapter-rewards-balances.csv", csv);
    }

    function exportActivity() {
      if (!state.detail) return;
      const rows = filteredTransactions(state.detail);
      const code = state.detail.chapter && state.detail.chapter.chapter_code || "chapter";
      const csv = toCsv(rows, [
        { label: "Effective", value: row => dateOnly(row.effective_date) },
        { label: "Posted", value: row => dateTime(row.posted_at) },
        { label: "Source", value: row => row.source_label },
        { label: "Detail", value: row => row.public_detail },
        { label: "Points", value: row => row.points_delta },
        { label: "Balance After", value: row => row.running_balance },
        { label: "Entries", value: row => row.entry_count },
        { label: "Run", value: row => row.run_id }
      ]);
      downloadCsv(`chapter-rewards-${code}-activity.csv`, csv);
    }

    els.refreshBtn.addEventListener("click", () => loadBalances());
    els.exportBalancesBtn.addEventListener("click", exportBalances);
    els.searchInput.addEventListener("input", () => { handleChapterSearchInput(); });
    els.searchInput.addEventListener("keydown", handleChapterSearchKeydown);
    els.sortSelect.addEventListener("change", handleSortChange);
    els.nonzeroOnly.addEventListener("change", refreshBalanceFilterView);
    els.expiringOnly.addEventListener("change", refreshBalanceFilterView);
    els.balancesBody.addEventListener("click", event => {
      const row = event.target.closest("tr[data-chapter]");
      if (row) selectChapter(row.dataset.chapter);
    });
    els.balancesBody.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const row = event.target.closest("tr[data-chapter]");
      if (!row) return;
      event.preventDefault();
      selectChapter(row.dataset.chapter);
    });
    els.detailContent.addEventListener("click", event => {
      const tab = event.target.closest("[data-tab]");
      if (tab) {
        state.tab = tab.dataset.tab;
        renderDetail();
        return;
      }
      if (event.target.id === "exportActivityBtn") {
        exportActivity();
        return;
      }
      const manageRedemption = event.target.closest("[data-manage-redemption]");
      if (manageRedemption) {
        openReceiptModal(manageRedemption.dataset.manageRedemption);
      }
    });
    els.detailContent.addEventListener("change", event => {
      if (event.target.id === "sourceFilter") {
        state.sourceFilter = event.target.value;
        renderDetail();
      }
    });
    els.closeDebitBtn.addEventListener("click", closeDebitModal);
    els.debitModal.addEventListener("click", event => {
      if (event.target === els.debitModal) closeDebitModal();
    });
    els.previewDebitBtn.addEventListener("click", previewDebit);
    els.debitForm.addEventListener("submit", event => {
      event.preventDefault();
      postDebit();
    });
    [
      els.debitChapter,
      els.debitDate,
      els.debitPoints,
      els.debitPaymentMode,
      els.debitDescription,
      els.debitRequestId,
      els.debitNotes
    ].forEach(input => input.addEventListener("input", clearDebitPreview));
    els.debitReceipts.addEventListener("change", () => {
      state.debitUploadWarning = null;
      renderDebitReceiptSummary();
      renderDebitNotice();
    });
    els.debitNotice.addEventListener("click", event => {
      const reviewButton = event.target.closest("[data-manage-posted-redemption]");
      if (!reviewButton) return;
      closeDebitModal();
      openReceiptModal(reviewButton.dataset.managePostedRedemption);
    });
    els.debitCategory.addEventListener("change", () => {
      if (els.debitCategory.value === "chapter_renewal") els.debitPaymentMode.value = "dues_credit";
      if (els.debitCategory.value === "go_promotion") els.debitPaymentMode.value = "reimbursement";
      clearDebitPreview();
    });
    els.debitConfirm.addEventListener("change", renderDebitNotice);
    els.closeReceiptBtn.addEventListener("click", closeReceiptModal);
    els.receiptModal.addEventListener("click", event => {
      if (event.target === els.receiptModal) closeReceiptModal();
    });
    els.uploadReceiptsBtn.addEventListener("click", uploadReceipts);
    els.saveReceiptNotesBtn.addEventListener("click", saveReceiptNotes);
    els.receiptList.addEventListener("click", event => {
      const button = event.target.closest("[data-delete-receipt]");
      if (button) deleteReceipt(button.dataset.deleteReceipt);
    });

    loadBalances();
    initializeAdmin();
  </script>
</body>
</html>
